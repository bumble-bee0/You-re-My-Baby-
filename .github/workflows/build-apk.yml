name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Mencari file ZIP project..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP ditemukan: $ZIP_FILE"

            mkdir -p "$RUNNER_TEMP/ymb-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/ymb-project"

            echo "Mencari root Gradle project..."

            PROJECT_ROOT=$(find "$RUNNER_TEMP/ymb-project" \
              -type f \
              -name "settings.gradle" \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_ROOT" ]; then
              echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP."
              exit 1
            fi

            echo "Project root: $PROJECT_ROOT"

            cp -a "$PROJECT_ROOT"/. .

            echo "Isi root repository setelah extract:"
            ls -la

          else
            echo "Tidak ada ZIP. Menggunakan project yang sudah ada."
          fi

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo "Pastikan ZIP project berisi file Gradle yang lengkap."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: folder app tidak ditemukan."
            exit 1
          fi

          echo "Gradle project ditemukan."
          echo "settings.gradle:"
          ls -l settings.gradle 2>/dev/null || true

          echo "Folder app:"
          ls -la app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youre-my-baby-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
